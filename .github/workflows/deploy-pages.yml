name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        # npm ci requires package-lock.json to exactly match package.json,
        # including OS/arch-specific optional dependency entries. Since this
        # lockfile is maintained from macOS, `npm install` locally can prune
        # Linux-only optional entries (e.g. wasm32-wasi rollup/oxide
        # binaries), which then makes npm ci fail on this ubuntu runner.
        # npm install is more forgiving and self-heals that drift.
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: https://gqvsxqkviqsrvaumytdm.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_b1DaiReNGoFOrqU9Rs3n3g_qzT8CxtA
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          if [ "$repo_name" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            base_path="/"
          else
            base_path="/$repo_name/"
          fi

          echo "Building with BASE_PATH=$base_path"
          BASE_PATH="$base_path" npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

